# Contrôle continu : rejoue sur GitHub, à chaque push sur main et à chaque pull
# request vers main, les portes que chaque chantier lance à la main avant de
# commiter — lint, types, gardes (src/app/route-invariants.test.ts), puis un
# build de production.
#
# AUCUN secret, et il ne faut pas en ajouter : le build n'en a pas besoin
# (les variables SMTP/reCAPTCHA ne sont lues qu'à l'exécution de /api/contact,
# NEXT_PUBLIC_GA_MEASUREMENT_ID absent = GA4 non chargé, cf. ConsentBootstrap).
#
# Le contrôle des URLs contractuelles (npm run check:contract) n'est PAS ici :
# il interroge la production, que ce workflow ne doit pas faire dépendre d'un
# réseau externe.
#
# Le nom du job est l'identifiant du check chez GitHub (et chez Vercel si ses
# Deployment Checks sont branchés) : le renommer oblige à refaire ce réglage.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérification (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts et les types de routes (PageProps, LayoutProps) sont générés
      # par Next et jamais commités (.gitignore). Aujourd'hui tsc passe sans eux
      # (vérifié sur une copie neuve, 2026-10-01) ; l'étape évite qu'il casse le
      # jour où une page s'appuie sur un type généré.
      - name: Générer les types de routes
        run: npx next typegen

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build de production
        run: npm run build
